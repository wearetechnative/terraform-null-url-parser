name: Terratest

on:
  push:
    branches: [main]
  pull_request:

jobs:
  terratest:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      # Terratest shells out to terraform; the runner image does not ship it.
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          cache-dependency-path: "**/*.sum"
          go-version: '1.21.3'

      # go mod download, not go mod tidy: tidy re-resolves the dependency graph
      # on every run, which is how a newly published nested terratest module
      # turned this check red without anything in this repository changing.
      - name: Download modules
        working-directory: test
        run: go mod download

      - name: Test Terraform
        working-directory: test
        run: go test -v
